{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Editar perfil</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="{% url 'profile_view' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
