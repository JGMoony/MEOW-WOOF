{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Cambiar contraseña</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
        <a href="{% url 'profile_view' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
