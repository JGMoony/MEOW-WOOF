<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Pet Shop</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background: linear-gradient(135deg, #FFF3E2, #FFE6E6, #E0F7FA); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .register-container { 
            background-color: #fff; 
            padding: 40px 35px; 
            border-radius: 20px; 
            border: 3px solid #FFD166;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            width: 420px; 
            text-align: center; 
            position: relative;
            transition: transform 0.3s ease;
        }
        .register-container:hover {
            transform: translateY(-5px);
        }
        .register-container h1 { 
            color: #FF6F61; 
            margin-bottom: 25px; 
            font-size: 30px; 
            animation: fadeBounce 1.2s ease-out;
        }
        @keyframes fadeBounce {
            0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
            60% { opacity: 1; transform: translateY(5px) scale(1.05); }
            80% { transform: translateY(-2px) scale(0.98); }
            100% { transform: translateY(0) scale(1); }
        }
        form { 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
        }
        .form-group, .form_group { 
            display: flex; 
            flex-direction: column; 
            text-align: left; 
        }
        label { 
            margin-bottom: 6px; 
            font-weight: 600; 
            color: #444; 
        }
        input[type="text"], input[type="email"], input[type="password"] { 
            padding: 12px; 
            border-radius: 10px; 
            border: 2px solid #ddd; 
            font-size: 15px; 
            transition: all 0.3s ease; 
            background: #FFFDF9;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus { 
            border-color: #FF6F61; 
            outline: none; 
            box-shadow: 0 0 8px rgba(255, 111, 97, 0.5); 
        }
        button { 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            background: linear-gradient(90deg, #06D6A0, #1CB5E0); 
            color: #fff; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        button:hover { 
            background: linear-gradient(90deg, #04b68a, #159ac4); 
            transform: scale(1.03); 
        }
        p { 
            margin-top: 20px; 
            font-size: 14px; 
            color: #555; 
        }
        a { 
            color: #EF476F; 
            text-decoration: none; 
            font-weight: bold; 
        }
        a:hover { text-decoration: underline; }

        /* Mensajes */
        .messages { 
            margin-bottom: 15px; 
            list-style: none; 
            padding: 10px; 
            border-radius: 8px;
            background: #FFF3CD; 
            color: #856404;
            font-size: 14px;
            text-align: left;
        }

        /* Animaciones gatito */
        .eye { animation: blink 4s infinite; transform-origin: center; }
        .tongue { animation: tongueMove 2s infinite ease-in-out; }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        @keyframes tongueMove {
            0%, 100% { height: 0; }
            40%, 60% { height: 10px; }
        }
    </style>
</head>
<body>
    <div class="register-container">

        <!-- 🐱 Gatito kawaii estilo imagen -->
        <svg width="200" height="200" viewBox="0 0 200 200">
            <!-- Cabeza -->
            <circle cx="100" cy="80" r="60" fill="#222"/>
            <!-- Orejas -->
            <polygon points="50,60 70,10 90,60" fill="#222"/>
            <polygon points="110,60 130,10 150,60" fill="#222"/>
            <polygon points="57,55 70,20 83,55" fill="pink"/>
            <polygon points="117,55 130,20 143,55" fill="pink"/>
            <!-- Ojos -->
            <circle class="eye" cx="75" cy="80" r="20" fill="white"/>
            <circle class="eye" cx="125" cy="80" r="20" fill="white"/>
            <circle cx="75" cy="80" r="10" fill="black"/>
            <circle cx="125" cy="80" r="10" fill="black"/>
            <circle cx="72" cy="75" r="5" fill="white"/>
            <circle cx="122" cy="75" r="5" fill="white"/>
            <!-- Nariz -->
            <circle cx="100" cy="95" r="6" fill="pink"/>
            <!-- Boca -->
            <path d="M90 105 Q100 115 110 105" stroke="black" stroke-width="3" fill="none"/>
            <!-- Lengua -->
            <rect class="tongue" x="95" y="105" width="10" height="0" fill="#ff4c7a" rx="5"/>
            <!-- Bigotes -->
            <line x1="60" y1="95" x2="30" y2="90" stroke="black" stroke-width="2"/>
            <line x1="60" y1="100" x2="30" y2="100" stroke="black" stroke-width="2"/>
            <line x1="140" y1="95" x2="170" y2="90" stroke="black" stroke-width="2"/>
            <line x1="140" y1="100" x2="170" y2="100" stroke="black" stroke-width="2"/>
            <!-- Cuerpo -->
            <ellipse cx="100" cy="160" rx="50" ry="25" fill="#222"/>
            <!-- Patitas -->
            <ellipse cx="80" cy="155" rx="12" ry="20" fill="#222"/>
            <ellipse cx="120" cy="155" rx="12" ry="20" fill="#222"/>
            <!-- Colita -->
            <path d="M150 150 Q180 140 160 170" stroke="#222" stroke-width="15" fill="none" stroke-linecap="round"/>
        </svg>

        <h1>Crear cuenta</h1>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Usuario:</label>
                <input type="text" name="username" id="id_username" placeholder="Ingresa tu usuario" required>
            </div>

            <div class="form-group">
                <label for="id_email">Correo electrónico:</label>
                <input type="email" name="email" id="id_email" placeholder="tu@email.com" required>
            </div>

            <div class="form_group">
                <label for="first_name">Nombre:</label>
                <input type="text" name="first_name" placeholder="Pablito" required>
            </div>

            <div class="form_group">
                <label for="last_name">Apellido:</label>
                <input type="text" name="last_name" placeholder="Perez" required>
            </div>

            <div class="form-group">
                <label for="id_password1">Contraseña:</label>
                <input type="password" name="password1" id="id_password1" placeholder="Mínimo 8 caracteres" required>
                <small class="help-text">Crea una contraseña segura. Solo se mostrará un mensaje si es incorrecta.</small>
            </div>

            <div class="form-group">
                <label for="id_password2">Contraseña (confirmación):</label>
                <input type="password" name="password2" id="id_password2" placeholder="Repite la contraseña" required>
            </div>

            <button type="submit">Registrarme</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
</body>
</html>
