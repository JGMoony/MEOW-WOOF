{% extends "base.html" %}
{% block content %}
<h2>Eliminar reseña</h2>
<p>¿Estás seguro de que quieres eliminar tu reseña para <strong>{{ review.product.name }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'product_detail' review.product.id %}">Cancelar</a>
</form>
{% endblock %}
