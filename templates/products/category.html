{% extends "base.html" %}

{% block content %}
<h2>Productos en {{ category.name }}</h2>

<div style="display:flex; flex-wrap:wrap; gap:20px;">
    {% for product in products %}
        {% include "products/product_card.html" %}
    {% empty %}
        <p>No hay productos en esta categoría.</p>
    {% endfor %}
</div>
{% endblock %}
