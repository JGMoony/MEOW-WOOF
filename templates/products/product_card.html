<style>
  .button-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }

  .btn-flip {
    background-color: #fbeee0;
    border: 2px solid #422800;
    border-radius: 30px;
    box-shadow: #422800 4px 4px 0 0;
    color: #422800;
    cursor: pointer;
    display: inline-block;
    font-weight: 600;
    font-size: 18px;
    padding: 0 18px;
    line-height: 50px;
    text-align: center;
    text-decoration: none;
    user-select: none;
    touch-action: manipulation;
  }

  .btn-flip:hover {
    background-color: #fff;
  }

  .btn-flip:active {
    box-shadow: #422800 2px 2px 0 0;
    transform: translate(2px, 2px);
  }

  @media (min-width: 768px) {
    .btn-flip {
      min-width: 120px;
      padding: 0 25px;
    }
  }

  .button-21 {
    align-items: center;
    appearance: none;
    background-size: calc(100% + 20px) calc(100% + 20px);
    border-radius: 100px;
    border-width: 0;
    box-shadow: none;
    box-sizing: border-box;
    color: #FFFFFF;
    cursor: pointer;
    display: inline-flex;
    font-family: CircularStd, sans-serif;
    font-size: 1rem;
    height: auto;
    justify-content: center;
    line-height: 1.5;
    padding: 6px 20px;
    position: relative;
    text-align: center;
    text-decoration: none;
    transition: background-color .2s, background-position .2s;
    user-select: none;
    touch-action: manipulation;
    vertical-align: top;
    white-space: nowrap;
  }

  .button-21:active,
  .button-21:focus {
    outline: none;
  }

  .button-21:hover {
    background-position: -20px -20px;
  }

  .button-21:focus:not(:active) {
    box-shadow: rgba(40, 170, 255, 0.25) 0 0 0 .125em;
  }

  .btn-edit {
    background-color: #ffe08a;
    background-image: linear-gradient(1deg, #ffe08a, #fdd76a 99%);
  }

  .btn-delete {
    background-color: #ef476f;
    background-image: linear-gradient(1deg, #ef476f, #d62828 99%);
  }

@media (min-width: 768px) {
  .btn-flip {
    min-width: 120px;
    padding: 0 25px;
  }
}
</style>

<div style="border:2px solid #ffd166; border-radius:15px; padding:15px; width:220px; background:#fffaf0; 
            box-shadow:2px 2px 6px rgba(0,0,0,0.1); text-align:center;">
    
  {% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.name }}" 
        style="width:100%; height:180px; object-fit:cover; border-radius:10px;">
  {% else %}
    <img src="https://place-puppy.com/220x180" alt="Producto" 
        style="width:100%; height:180px; object-fit:cover; border-radius:10px;">
  {% endif %}

  <h3 style="margin-top:10px; color:#333;">
    <a href="{% url 'product_detail' product.id %}" 
      style="text-decoration:none; color:#ff6f61;">
      {{ product.name }}
    </a>
  </h3>

  <p style="font-size:1.1em; font-weight:bold; color:#4caf50;">
    ${{ product.price|floatformat:0|cut:"," }}
  </p>
  <p style="font-size:0.9em; color:#666;">
    ⭐ {{ product.average_rating }} ({{ product.total_reviews }} reseñas)
  </p>
  
  <!-- Botones -->
  <div class="button-group">
  <a href="{% url 'product_detail' product.id %}" class="btn-flip">
    Ver Producto
  </a>

  {% if user.is_authenticated and user.is_staff %}
    <a href="{% url 'product_update' product.id %}" class="button-21 btn-edit">
      Editar
    </a>
    <a href="{% url 'product_delete' product.id %}" class="button-21 btn-delete">
      Eliminar
    </a>
  {% endif %}
</div>
</div>
